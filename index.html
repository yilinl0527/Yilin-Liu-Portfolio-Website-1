<style id="yl-css">
/* Layout: the name as a monument at the foot of the first screen; a two-column project grid whose fields flood with each project's own colour; plain stone ground, one blueprint accent. */
:root{
  --bg:#E9E8E4; --surface:#DEDDD8; --surface-2:#D2D1CB; --ink:#1D1C18; --muted:#55534C;
  --accent:#2456D6; --on-accent:#FFFFFF;
  --field:#DEDDD8; --field-hi:#E8E7E3; --on-field:#1D1C18; --frame:#FFFFFF; --flood-ink:#FFFFFF;
  --scrim:rgba(17,17,15,.96); --on-scrim:#F1F0EC; --danger:#B42318;
  --f:"Schibsted Grotesk","Helvetica Neue",Helvetica,Arial,sans-serif;
  --step-small:clamp(.8125rem,.79rem + .1vw,.875rem);
  --step-body:clamp(1.0625rem,1rem + .25vw,1.1875rem);
  --step-lead:clamp(1.25rem,1.1rem + .7vw,1.625rem);
  --step-head:clamp(2rem,1.3rem + 3.2vw,4rem);
  --edge:clamp(0px,1.4vw,16px);
  --top-h:64px;
  --fit-h:calc(100svh - var(--top-h) - 48px);
  --acc:var(--ink);
  --ease:cubic-bezier(.2,.7,.2,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141412; --surface:#1E1E1B; --surface-2:#292925; --ink:#ECEBE6; --muted:#A9A79F;
  --accent:#86A4F6; --on-accent:#0D1530; --field:#CFCEC8; --field-hi:#DCDBD6; --frame:#F4F3EF; --danger:#F07A74; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141412; --surface:#1E1E1B; --surface-2:#292925; --ink:#ECEBE6; --muted:#A9A79F;
  --accent:#86A4F6; --on-accent:#0D1530; --field:#CFCEC8; --field-hi:#DCDBD6; --frame:#F4F3EF; --danger:#F07A74; color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 var(--step-body)/1.55 var(--f);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-font-smoothing:antialiased;font-kerning:normal}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
a{color:inherit}
img{max-width:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
::selection{background:var(--accent);color:var(--on-accent)}
.wrap{padding-inline:var(--edge)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
p{margin:0}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:.5em;background:var(--accent);color:var(--on-accent);text-decoration:none;font-weight:600;font-size:var(--step-small);padding:.85em 1.2em;border:0;border-radius:0;cursor:pointer;transition:transform .2s var(--ease),background .2s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(0)}
.link{font-weight:600;text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:.25em;transition:color .2s}
.link:hover{color:var(--accent)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;background:var(--bg);
  margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{height:var(--top-h);display:flex;align-items:center;gap:clamp(14px,2.6vw,36px);padding-inline:var(--edge)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:700;font-size:1.05rem;letter-spacing:-.01em;white-space:nowrap}
.mark{display:block;height:30px;width:auto;flex:none;fill:currentColor;transition:fill .3s var(--ease)}
.nm-y{display:inline-block;height:calc(var(--cap,.72) * 1em);width:auto;fill:currentColor;vertical-align:baseline;margin-right:0;overflow:visible}
.nm-dot{display:inline-block;width:calc(var(--cap,.72) * .2267em);height:calc(var(--cap,.72) * .2267em);background:currentColor;margin-left:.05em;vertical-align:baseline}
.nav{margin-left:auto;display:flex;align-items:center;gap:clamp(16px,2.6vw,36px)}
.nav > a,.nav-work > button{font-weight:500;font-size:1rem;text-decoration:none;padding:10px 0;background:none;border:0;cursor:pointer;display:inline-flex;align-items:center;gap:6px;position:relative}
.nav > a::after,.nav-work > button::after{content:"";position:absolute;left:0;right:0;bottom:4px;height:2px;background:var(--ink);transform:scaleX(0);transform-origin:left;transition:transform .25s var(--ease)}
.nav > a:hover::after,.nav > a[aria-current="page"]::after,.nav-work > button:hover::after,.nav-work.on > button::after{transform:scaleX(1)}
.nav-work{position:relative}
.caret{width:9px;height:9px;transition:transform .2s}
.nav-work.open .caret{transform:rotate(180deg)}
.dd{position:absolute;top:calc(100% + 6px);right:-16px;z-index:40;background:var(--bg);box-shadow:0 18px 50px rgba(0,0,0,.18); /* taste-skill-ignore: dropdown menu floats */width:min(560px,calc(100vw - 32px));display:grid;grid-template-columns:minmax(0,1fr) 180px;gap:0;padding:10px;opacity:0;transform:translateY(-6px);pointer-events:none;transition:opacity .18s,transform .18s var(--ease)}
.nav-work.open .dd{opacity:1;transform:none;pointer-events:auto}
.dd ol{list-style:none;margin:0;padding:0}
.dd a{display:grid;grid-template-columns:2.4em minmax(0,1fr);align-items:baseline;gap:8px;padding:9px 10px;text-decoration:none;font-weight:600;font-size:1.02rem;line-height:1.25;transition:background .15s}
.dd a span{font-variant-numeric:tabular-nums;color:color-mix(in oklab,var(--acc) 80%,var(--ink));font-weight:700}
.dd a:hover,.dd a:focus-visible,.dd a.hot{background:var(--surface)}
.dd small{display:block;font-weight:400;color:var(--muted);font-size:var(--step-small)}
.dd-prev{background:var(--field);display:grid;place-items:center;overflow:hidden;transition:background .25s}
.dd-prev img{max-width:84%;max-height:84%;object-fit:contain}
.btn-edit{border:1.5px solid var(--ink);background:transparent;padding:8px 14px;font-weight:600;font-size:.85rem;cursor:pointer;white-space:nowrap}
.btn-edit:hover,.btn-edit.on{background:var(--ink);color:var(--bg)}
@media (max-width:340px){.brand-name{display:none}}
@media (max-width:640px){.dd{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));top:calc(var(--top-h) + env(safe-area-inset-top,0px));width:auto;grid-template-columns:1fr}.dd-prev{display:none}.nav{gap:18px}}

/* hero: the name as monument */
.hero{position:relative;min-height:calc(88svh - var(--top-h));display:grid;grid-template-rows:auto 1fr auto;padding-top:clamp(28px,5vw,72px);overflow:hidden}
.hero-top{grid-row:1;display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:clamp(24px,4vw,64px);align-items:start}
.hero-lede{font-size:var(--step-lead);line-height:1.3;max-width:30ch;font-weight:500;letter-spacing:-.01em}
.hero-act{margin-top:clamp(20px,2.4vw,32px);display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center}
.now{display:grid;gap:14px;font-size:var(--step-small);margin:0}
.now div{display:grid;grid-template-columns:7.5em minmax(0,1fr);gap:12px}
.now dt{color:var(--muted)}
.now dd{margin:0;font-weight:500}
.monument{grid-row:3;margin:clamp(24px,4vw,48px) calc(-1 * var(--edge)) 0;line-height:.8;font-weight:800;letter-spacing:-.055em;white-space:nowrap;color:var(--name,var(--ink));transition:color .35s var(--ease);font-size:20.5vw;transform-origin:50% 100%;will-change:transform;padding-bottom:.02em}
.monument span{display:inline-block}
@media (max-width:760px){.hero{min-height:auto}.hero-top{grid-template-columns:1fr}.now div{grid-template-columns:6.5em minmax(0,1fr)}}

/* sections */
.sec{padding-top:clamp(96px,11vw,180px)}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:20px;margin-bottom:clamp(24px,3vw,40px)}
.sec-h h2{font-size:var(--step-head);line-height:1;letter-spacing:-.035em}

/* project grid */
.tiles{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(40px,4.4vw,72px) clamp(16px,1.8vw,28px)}
@media (max-width:720px){.tiles{grid-template-columns:minmax(0,1fr)}}
.tile{position:relative;min-width:0}
.tile-a{display:block;text-decoration:none;color:inherit}
.tile-field{position:relative;aspect-ratio:4/3;background:var(--field);overflow:hidden;transition:background .45s var(--ease)}
.tile-num{position:absolute;z-index:3;left:clamp(14px,1.6vw,24px);top:clamp(10px,1.2vw,18px);font-weight:800;font-size:clamp(2.6rem,1.8rem + 2.4vw,4.6rem);line-height:1;letter-spacing:-.05em;color:var(--acc-field,var(--acc));transition:color .35s var(--ease)}
.tile-img{position:absolute;inset:14% 10% 8%;display:flex;align-items:center;justify-content:center;z-index:2}
.tile-img img{max-width:100%;max-height:100%;object-fit:contain;transition:transform .7s var(--ease)}
.tile-img.cover{inset:0;z-index:0}
.tile-img.cover img{width:100%;height:100%;max-width:none;max-height:none;object-fit:cover;filter:none}
.tile-img.multiply img{mix-blend-mode:multiply}
.tile-a:hover .tile-field,.tile-a:focus-visible .tile-field{background:var(--acc-field,var(--acc))}
.tile-a:hover .tile-num,.tile-a:focus-visible .tile-num{color:var(--field-ink,#FFFFFF)}
.tile-a:hover .tile-img img,.tile-a:focus-visible .tile-img img{transform:translateY(-10px) rotate(-2deg) scale(1.03)}
.tile-a:hover .tile-img.cover img,.tile-a:focus-visible .tile-img.cover img{transform:scale(1.04)}
.tile-cap{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 20px;padding-top:18px;align-items:baseline}
.tile-t{font-size:clamp(1.4rem,1.1rem + 1vw,2rem);line-height:1.05;letter-spacing:-.025em}
.tile-status{font-size:var(--step-small);font-weight:600;color:color-mix(in oklab,var(--acc) 70%,var(--ink))}
.tile-line{grid-column:1 / -1;max-width:52ch}
.tile-tags{grid-column:1 / -1;color:var(--muted);font-size:var(--step-small)}

/* other teaser */
.strip{display:flex;gap:clamp(10px,1.2vw,18px);align-items:flex-start}
.strip a{display:block;flex:var(--r) 1 0;aspect-ratio:var(--r);min-width:0;overflow:hidden;background:var(--surface)}
@media (max-width:720px){.strip a:nth-child(n+3){display:none}}
.strip img{display:block;width:100%;height:100%;object-fit:contain;transition:transform .7s var(--ease)}
.strip a:hover img{transform:scale(1.05)}

/* about teaser */
.about-t{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:clamp(24px,4vw,64px);align-items:end}
.about-t p{font-size:var(--step-lead);line-height:1.32;font-weight:500;letter-spacing:-.01em;max-width:34ch}
@media (max-width:760px){.about-t{grid-template-columns:1fr}}

/* footer */
.foot{margin-top:clamp(120px,12vw,200px);background:var(--ink);color:var(--bg);
  margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:max(16px,env(safe-area-inset-bottom,0px));overflow:hidden}
.foot-in{padding:clamp(40px,5vw,72px) var(--edge) 0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px}
.foot-in h3{font-size:var(--step-small);font-weight:600;margin-bottom:10px;letter-spacing:0;opacity:.7}
.foot-in > div:last-child{grid-column:-2}
.foot-in ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.foot-in a{text-decoration:none}
.foot-in a:hover{text-decoration:underline;text-underline-offset:.2em}
.foot-name{margin:clamp(48px,8vw,140px) 0 0;font-weight:800;line-height:.78;letter-spacing:-.055em;white-space:nowrap;font-size:20.5vw}
.foot-legal{display:flex;justify-content:center;text-align:center;flex-wrap:wrap;gap:8px;font-size:.8125rem;opacity:.7;padding:18px var(--edge) 4px}
@media (max-width:760px){.foot-in{grid-template-columns:repeat(2,minmax(0,1fr))}}
body.has-bar .foot{padding-bottom:120px}

/* case study */
.case-hero{padding-top:clamp(28px,4vw,56px)}
.back{font-weight:500;text-decoration:none;display:inline-flex;gap:8px;padding:6px 0}
.back:hover{color:var(--accent)}
.case-head{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:clamp(24px,4vw,64px);align-items:end;margin-top:clamp(20px,3vw,40px)}
.case-num{font-weight:800;font-size:clamp(5rem,3rem + 9vw,12rem);line-height:.8;letter-spacing:-.06em;color:var(--acc)}
.case-title{font-size:clamp(2.6rem,1.6rem + 4.4vw,5.6rem);line-height:.92;letter-spacing:-.045em;margin-top:clamp(12px,1.6vw,20px)}
.case-sum{font-size:var(--step-lead);line-height:1.35;margin-top:22px;max-width:44ch;letter-spacing:-.005em}
.case-sum p{margin:0}

0+ in prototyping grants."},{"title":"Design Intern","meta":"ShareBot (AGIBOT), Shanghai · Jul – Aug 2026","text":"Designed a custom helmet for the AGIBOT X2 humanoid robot launch and an interactive race track deployed in 500+ malls across China; UX/UI layouts for the JD E-comm storefront."},{"title":"Design & Creative Marketing Intern","meta":"Day-Guard, Providence · Jan – Apr 2026","text":"Marketing creatives that grew followers 54% and drew 100,000+ organic views; directed product shoots."},{"title":"Automotive Design Intern","meta":"Stellantis, Shanghai · Jun – Aug 2025","text":"Owned the \"Snow Trace\" Jeep Wrangler graphics for a 150-vehicle run in Japan; rendered Alfa Romeo 115th anniversary Giulia liveries."}]},{"title":"Education","items":[{"title":"BFA Industrial Design","meta":"Rhode Island School of Design · Expected June 2028","text":""}]},{"title":"Award","items":[{"title":"National Gold Medal & American Visions Award","meta":"2024 Scholastic Art & Writing Awards","text":"For the Anti-Tremor Cup, in the top 1% of 340,000 submissions."}]},{"title":"Skills","items":[{"title":"Design","meta":"","text":"3D CAD modeling, rapid multi-material prototyping, sketching and technical drawing, FDM/SLA printing, laser cutting, wood and metal fabrication, silicone molding, vacuum forming, graphic design, mechatronics, DFM"},{"title":"Software","meta":"","text":"Rhino 8, SolidWorks, Fusion 360, KeyShot, Adobe CC, Figma, Unity, generative AI"},{"title":"Languages","meta":"","text":"Native proficiency in English, French and Mandarin"}]},{"title":"Interests","items":[{"title":"","meta":"","text":"CSIA Level 2 ski instructor · Black belt 1st Dan, taekwondo · OFSAA long jumper · RISD basketball team · Freelance painter · RCM Level 8 piano"}]}]},"contact":{"label":"Contact","heading":"Let's talk","body":"Open to internships and collaborations.","items":[{"label":"Email","value":"yliu42@risd.edu"},{"label":"Phone","value":"(+1) 401-595-6308"},{"label":"LinkedIn","value":"https://www.linkedin.com/in/yilin-liu-a730bb204/"}]},"now":[],"other":{"heading":"Other work","intro":"Paintings, drawings, installations, furniture and objects made alongside the design work.","items":[{"id":"mortis","title":"MORTIS","medium":"Turned and carved walnut wood","size":"","year":"2026","body":"A jewelry stand designed as a sculptural altar for silver jewelry, mirroring the tough-luxury ethos of Chrome Hearts and the cold of late fall and early winter.\n\nYour jewelry deserves more than a bland, basic surface. It needs a holder that doesn't just store it, but elevates and accentuates the craft. It needs an art piece of its own.","cover":{"src":"mo-cover.webp","r":1.1852},"images":[{"src":"mo-1.webp","r":0.75},{"src":"mo-2.webp","r":0.75},{"src":"mo-3.webp","r":0.75},{"src":"mo-4.webp","r":0.75},{"src":"mo-render.webp","r":0.9567},{"src":"mo-lathe.webp","r":0.75},{"src":"mo-turn.webp","r":0.75},{"src":"mo-parts.webp","r":0.75}]},{"id":"lotus","title":"Lotus","medium":"14-gauge aluminum, threaded rod, washers, aluminum tube","size":"","year":"2026","body":"This project, titled Lotus, is an exploration of kinetic symmetry and modular nesting. Building on previous experiments with threaded rod assemblies, I integrated 14-gauge aluminum to investigate how formed curves can interact through rotation. The objective was to move beyond static stacking, utilizing the properties of a threaded rod to create a spinning \"blooming\" effect.\n\nFor my experimentations, I cut out aluminum sheets varying in both length and width to create a tapering effect that draws the eye toward the center of the petal. This geometry creates a shifting visual rhythm when the object is in motion, as the varying widths produce a staggered, moiré-like effect during rotation. By introducing washers as low-friction spacers between each layer, I enabled each individual \"petal\" to rotate independently. To emphasize the piece's tactile nature, I filed the corners using a notcher and hand-filed every edge, ensuring the metal invited physical contact rather than resisting it.\n\nThe final assembly utilizes a central aluminum tube that serves as an ergonomic handle, allowing for single-handed or two-handed manipulation.","cover":{"src":"lo-cover.webp","r":0.75},"images":[{"src":"lo-spin-poster.webp","video":"lo-spin.mp4","r":0.5625,"webm":"lo-spin.webm"},{"src":"lo-1.webp","r":0.75},{"src":"lo-2.webp","r":0.75},{"src":"lo-3.webp","r":0.75}]},{"id":"yearning","title":"Yearning","medium":"Oil paint on canvas","size":"76 × 91 cm (30\" × 36\")","year":"","body":"","cover":{"src":"a-yearning.webp","r":0.8319},"images":[]},{"id":"striae","title":"The Striae Chair","medium":"Laser-cut wood ribs","size":"","year":"","body":"A lounge chair built from a series of precision laser-cut wooden ribs. The parallel ribs form a slatted seat and back, while the overall profile flows in one continuous S-curve.\n\nInspired by Kengo Kuma's wooden architecture, the design explores linear, rhythmic forms that capture light and define space through delicate repetition.","cover":{"src":"a-striae-1.webp","r":0.7497},"images":[{"src":"a-striae-2.webp","r":1.1407},{"src":"a-striae-3.webp","r":0.7497},{"src":"a-striae-4.webp","r":1.0518},{"src":"a-striae-5.webp","r":0.9276},{"src":"a-striae-6.webp","r":1.3333},{"src":"a-striae-7.webp","r":0.75},{"src":"a-striae-8.webp","r":0.75}]},{"id":"dichotomy","title":"Dichotomy","medium":"Oil paint on canvas","size":"40 × 120 cm (16\" × 48\")","year":"","body":"","cover":{"src":"a-dichotomy.webp","r":3.0364},"images":[]},{"id":"where-is-home","title":"Where is Home?","medium":"Foam board, found wood","size":"","year":"","body":"Where is home? I've always struggled with that question. Having moved a lot and lived in different places, I find it difficult to call one place my \"home.\" The work consists of five architectural models, each a room I've lived in: Beijing (birth to age 4), Shanghai (4–6), France (6–10), Shanghai again (10–13) and Canada (13–18). I built them entirely from memory in foam board, with found wood for the doors and window frames.\n\nBuilding from memory was intentional: the models hold my fragmented recollections. Some rooms have the furniture I can recall; others are empty. I left every room white, the natural colour of the foam, for the emotional detachment I feel from these spaces.\n\nThe five rooms form a pentagon with every door facing an empty centre. The doors open and close, so a viewer can imagine standing in the middle, connected to each room but unable to fully enter any of them.","cover":{"src":"a-home-1.webp","r":1.3333},"images":[{"src":"a-home-2.webp","r":0.75},{"src":"a-home-3.webp","r":0.75},{"src":"a-home-4.webp","r":1.3326},{"src":"a-home-5.webp","r":0.75},{"src":"a-home-6.webp","r":0.75},{"src":"a-home-7.webp","r":0.7504},{"src":"a-home-8.webp","r":1.3326},{"src":"a-home-9.webp","r":1.3326}]},{"id":"mist","title":"Running into the Mist","medium":"Oil paint on canvas","size":"45 × 61 cm (18\" × 24\")","year":"","body":"","cover":{"src":"a-mist.webp","r":0.7487},"images":[]},{"id":"jellyfish","title":"Jellyfish","medium":"Plastic water bottles, paper ball lamp, spray foam, recycled metal wire, plastic gift wrap, cloth, LED strip","size":"60 × 60 × 230 cm (23.6\" × 23.6\" × 90.5\")","year":"","body":"A plastic-infused jellyfish sculpture.","cover":{"src":"a-jelly-1.webp","r":0.6667},"images":[{"src":"a-jelly-2.webp","r":0.6667},{"src":"a-jelly-3.webp","r":0.6667},{"src":"a-jelly-4.webp","r":0.7917},{"src":"a-jelly-5.webp","r":0.7503},{"src":"a-jelly-6.webp","r":0.7497},{"src":"a-jelly-7.webp","r":0.7497}]},{"id":"self-portrait-charcoal","title":"Self Portrait","medium":"Charcoal on Stonehenge","size":"102 × 154 cm (40\" × 60\")","year":"","body":"","cover":{"src":"a-selfportrait.webp","r":0.7532},"images":[]},{"id":"cymatics","title":"Cymatics: Visualizing Sound","medium":"Aluminium Chladni plate, speaker, wooden base, composed score","size":"","year":"","body":"This project explores cymatics, the visualisation of sound through vibration, using an aluminium Chladni plate. I composed a piece specifically for the plate's vibrational properties.\n\nExperimenting with a tone generator, I found that only frequencies from 100 Hz to just over 1,100 Hz resonated with the plate, each forming its own pattern: 100 Hz (G2), 192 Hz (G3), 240 Hz (B3), 262 Hz (C4), 302 Hz (D4), 332 Hz (E4), 396 Hz (G4), 440 Hz (A4), 486–530 Hz (B4 and C5), 660 Hz (E5), 702 Hz (F5) and 1,152 Hz (D6). I arranged them into chords that sustained resonance.\n\nAt those frequencies the plate forms standing waves: nodes stay still while antinodes move with the most amplitude, and the sand collects along the nodes. Because I couldn't modify the rented speaker, I built a wooden base that holds it and couples it to the plate through a 5\" nail.","cover":{"src":"a-cym-1.webp","r":0.7326},"images":[{"src":"a-cym-2.webp","r":0.7203},{"src":"a-cym-3.webp","r":1.3333},{"src":"a-cym-4.webp","r":0.7805},{"src":"a-cym-5.webp","r":0.75},{"src":"a-cym-6.webp","r":0.75},{"src":"a-cym-7.webp","r":0.75},{"src":"a-cym-8.webp","r":2.6408}]},{"id":"look-how-far","title":"Look How Far We've Come","medium":"Oil paint on canvas","size":"45 × 61 cm (18\" × 24\")","year":"","body":"","cover":{"src":"a-lookhowfar.webp","r":0.75},"images":[]},{"id":"pyramid","title":"Pyramid","medium":"Old fence, cadmium red paint, wire","size":"127 × 127 × 229 cm (50\" × 50\" × 96\")","year":"","body":"","cover":{"src":"a-pyramid.webp","r":0.75},"images":[{"src":"a-pyramid-2.webp","r":0.75},{"src":"a-pyramid-3.webp","r":1.3326},{"src":"a-pyramid-4.webp","r":0.7504}]},{"id":"fragments","title":"Fragments (Self-Portrait)","medium":"Coloured pencils on paper","size":"45 × 61 cm (18\" × 24\")","year":"","body":"","cover":{"src":"a-fragments.webp","r":0.75},"images":[]},{"id":"comfort","title":"Comfort","medium":"3 × 4 m cloth, plaster powder, old bed frame, old wood sticks, newspaper, projector","size":"100 × 120 p","r":0.75},"images":[]},{"id":"merch-23","title":"Arts Merch 2023–2024","medium":"Apparel design","size":"","year":"2023–2024","body":"","cover":{"src":"a-merch2-1.webp","r":1},"images":[{"src":"a-merch2-2.webp","r":1},{"src":"a-merch2-3.webp","r":1},{"src":"a-merch2-4.webp","r":1.0012},{"src":"a-merch2-5.webp","r":0.9923},{"src":"a-merch2-6.webp","r":0.9984}]},{"id":"commission-1","title":"Commission #1","medium":"Oil paint on canvas","size":"30 × 40 cm (12\" × 16\")","year":"","body":"","cover":{"src":"a-commission-1.webp","r":0.7463},"images":[]},{"id":"forms","title":"Form studies","medium":"3D model","size":"","year":"","body":"","cover":{"src":"a-forms-1.webp","r":0.75,"fit":"contain"},"images":[{"src":"a-forms-2.webp","r":0.75},{"src":"a-forms-3.webp","r":0.75}]},{"id":"commission-2","title":"Commission #2","medium":"Oil paint on canvas","size":"30 × 40 cm (12\" × 16\")","year":"","body":"","cover":{"src":"a-commission-2.webp","r":0.7508},"images":[]},{"id":"figure-study","title":"Human Figure Study","medium":"Pencil and charcoal; all hand drawn","size":"","year":"","body":"","cover":{"src":"a-fig-1.webp","r":0.7504},"images":[{"src":"a-fig-2.webp","r":0.8},{"src":"a-fig-3.webp","r":0.8},{"src":"a-fig-4.webp","r":0.8171},{"src":"a-fig-5.webp","r":0.8},{"src":"a-fig-6.webp","r":0.7985},{"src":"a-fig-7.webp","r":0.7497},{"src":"a-fig-8.webp","r":0.7989}]},{"id":"deep-shallow","title":"Deep & Shallow","medium":"Mixed media","size":"61 × 91 cm (24\" × 36\")","year":"","body":"","cover":{"src":"a-deep.webp","r":0.75},"images":[]},{"id":"self-portrait-mixed","title":"Self Portrait","medium":"Mixed media","size":"30 × 40 cm (12\" × 16\")","year":"","body":"","cover":{"src":"a-selfportrait-mixed.webp","r":0.7502},"images":[]},{"id":"untitled-portrait","title":"Untitled","medium":"Mixed media","size":"28 × 38 cm (11\" × 15\")","year":"","body":"","cover":{"src":"a-untitled-portrait.webp","r":0.75},"images":[]},{"id":"fragments-2","title":"Fragments (Self-Portrait)","medium":"Coloured pencils on paper","size":"45 × 61 cm (18\" × 24\")","year":"","body":"","cover":{"src":"a-fragments-2.webp","r":0.7547},"images":[]}]},"resume":"Yilin_Liu_Resume_2026-2027.pdf","labels":{},"staticSite":true},"projects":[{"id":"anti-tremor-cup","num":"01","title":"Anti-Tremor Cup","accent":"#FB7A00","oneLiner":"A user-centered approach to redefine drinking experiences for individuals with tremor challenges","summary":"Addressing hand tremors, exploring a user-centered approach to redefine drinking experiences for individuals with tremor challenges, prioritizing both functionality and elegance.","tags":[],"thumb":{"src":"cup-thumb.webp","r":1.5031},"hero":{"src":"cup-hero.webp","r":1,"caption":"Design #2, render","crop":{"x":50,"y":28,"z":1}},"meta":[{"k":"Award","v":"2024 Scholastic Art & Writing Awards National Gold Medal and American Visions Award (top 1% of 340,000 entries)"},{"k":"Focus","v":"Drinking with a hand tremor"},{"k":"Design #1","v":"Air dry clay, ball bearing, cardstock, watercolour paper, Mylar sheet"},{"k":"Design #2","v":"3D-printed model and renders"}],"blocks":[{"type":"text","label":"Origin","heading":"It started with my grandpa","body":"The inspiration for this design came to me during my summer visit to see my grandparents, where I discovered my grandpa had a hand tremor. Seeing him having trouble picking up cups of water to drink, I decided to come up with an innovative solution to tackle this issue.","image":{"src":"cup-grandpa.webp","r":0.669,"caption":"My grandpa drinking with a tremor","lay":{"d":{"w":111.48,"ar":1.1281,"x":-11.48}},"fit":"cover"},"side":"right"},{"type":"text","label":"Background research","heading":"Why a cup is hard to hold","body":"Hand tremors are involuntary rhythmic or oscillatory movements. Tremors can be intermittent (occurring at separate times with breaks) or constant. Whether the tremors are a result of conditions like essential tremor, Parkinson's disease, or other factors, they can pose challenges when it comes to activities that require precision and fine motor skills, such as drinking. The act of bringing a cup to the mouth, maintaining a steady grip, and avoiding spills becomes more difficult, potentially leading to embarrassment and frustration.\n\nIn social situations, the visible effects of hand tremors can also contribute to self-consciousness and may affect an individual's overall confidence. The impact of hand tremors on drinking underscores the broader impact of such motor difficulties on daily activities and social interactions, highlighting the importance of addressing and managing these symptoms for improved quality of life.","image":{"src":"cup-hand.webp","r":2.3016,"caption":"Hand tremor"},"side":"left","lay":{"d":{"mt":-30}}},{"type":"stats","label":"Statistics","heading":"","note":"","items":[{"value":"80 Million","text":"people worldwide are affected by tremors"},{"value":"Old & young","text":"Tremors affect both older and younger demographics"}],"lay":{"d":{"mt":-30}}},{"type":"steps","label":"The tremor experience","heading":"Three moments that go wrong","body":"","fit":"cover","items":[{"image":{"src":"cup-exp-1.webp","r":1.041,"fit":"cover"},"title":"Holding the cup","text":"Prepare to drink."},{"image":{"src":"cup-exp-2.webp","r":1.9016,"fit":"cover"},"title":"The hand begins to shake","text":"Water spills."},{"image":{"src":"cup-exp-3.webp","r":1.1606,"fit":"cover"},"title":"Cleaning up","text":"You have to clean the spill."}],"lay":{"d":{"mt":-30}}},{"type":"people","label":"User research","heading":"Persona","body":"","items":[{"name":"Liu Wei Guang","sub":"Age 77 · My grandpa","meta":[],"body":"Grandpa has been experiencing hand tremors for several years due to an underlying medical condition. He was an engineer, and loves spending time at home with grandma and fixing gadgets. Having a hand tremor makes it difficult for him to drink and eat properly. He likes to drink tea.","sections":[{"title":"Challenges","items":["Grip control: Grandpa struggles with gripping cups firmly. The tremors make it hard to maintain a steady hand, leading to spills.","Stability: Even when holding a cup, his hand tremors cause the liquid inside to shake, causing accidental spills or discomfort when drinking."]},{"title":"Pain points","items":["Difficulty in lifting cups without shaking.","Challenges in drinking hot liquids safely."]},{"title":"Goals","items":["To drink comfortably and confidently without spilling.","To regain independence in handling everyday tasks, like drinking from a cup, without relying on assistance."]}],"image":{"src":"cup-persona.webp","r":0.67}}],"lay":{"d":{"mt":-30}}},{"type":"statement","label":"Design statement","text":"How might we create an anti-tremor cup that not only effectively prevents spills but also enhances the overall drinking experience for individuals with hand tremors, fostering a sense of dignity and ease in their everyday activities?","groups":[{"title":"Design focus","items":["Counter tremor rotation","Customizability","Anti-spill layer"]}],"lay":{"d":{"mt":-62}}},{"type":"compare","label":"Market research","heading":"Market Research","body":"","items":[{"image":{"src":"cup-market-1.webp","r":1,"fit":"contain"},"title":"Rotating-handle mug","pros":["Rotates on the Z axis","Easy to use","Large handle","Simple design"],"cons":["Limited to one axis","Doesn't offer other accessibility supports or customizability"]},{"image":{"src":"cup-market-2.webp","r":1.2232,"fit":"contain"},"title":"Gyroscope bowl","pros":["Gyroscope, can rotate on all three axes","Simple and effective design"],"cons":["Handle looks difficult to hold","Designed for toddlers","No depth for water"]}],"notes":{"title":"","items":[]},"lay":{"d":{"mt":-38}}},{"type":"gallery","label":"Sketches","heading":"Sixteen ideas on paper","body":"","layout":"grid","images":[{"src":"cup-sketch-1.webp","r":0.731,"caption":"Ideas #1 & #2","fit":"contain"},{"src":"cup-sketch-2.webp","r":0.734,"caption":"Ideas #3 & #4","fit":"contain"},{"src":"cup-sketch-3.webp","r":0.756,"caption":"Ideas #5 & #6","fit":"contain"},{"src":"cup-sketch-4.webp","r":0.758,"caption":"Ideas #7 & #8","fit":"contain"},{"src":"cup-sketch-5.webp","r":0.74,"caption":"Ideas #9 & #10","fit":"contain"},{"src":"cup-sketch-6.webp","r":0.698,"caption":"Ideas #11 & #12","fit":"contain"},{"src":"cup-sketch-7.webp","r":0.768,"caption":"Ideas #13 & #14","fit":"contain"},{"src":"cup-sketch-8.webp","r":0.702,"caption":"Ideas #15 & #16","fit":"contain"}],"lay":{"d":{"mt":-57}}},{"type":"text","label":"Customizability feature","heading":"A handle for every tremor","body":"Customizability is a core feature of the design. Different people have different tremors. With individual needs in mind, users can tailor the cup to their preferences, adjusting grip, size, and even aesthetic elements. Making the handle fully customizable highlights user-centered design thinking, making products more accessible to everyone with this specific need.","lay":{"d":{"mt":-56}}},{"type":"gallery","label":"","heading":"","body":"","layout":"mosaic","images":[{"src":"cup-handles.webp","r":0.778,"caption":"Handle variations","fit":"contain"},{"src":"cup-cutouts-2.webp","r":1.3333,"caption":"Cardboard cutouts","fit":"contain"},{"src":"cup-cutouts-1.webp","r":0.75,"caption":"Cardboard cutouts","fit":"contain"},{"src":"cup-clay-1.webp","r":1.3339,"caption":"Clay handle mock-up"},{"src":"cup-clay-2.webp","r":1.3339,"caption":"Clay handle mock-up"}],"lay":{"d":{"mt":-87}}},{"type":"gallery","label":"Design #1","heading":"Development","body":"","layout":"mosaic","images":[{"src":"cup-d1-sketch.webp","r":0.7175,"caption":"Ball-bearing pivot, sketch","fit":"contain"},{"src":"cup-d1-dev-1.webp","r":0.7497},{"src":"cup-d1-dev-2.webp","r":0.75},{"src":"cup-d1-dev-3.webp","r":0.7497},{"src":"cup-d1-dev-4.webp","r":0.7497},{"src":"cup-d1-dev-5.webp","r":0.7497},{"src":"cup-d1-dev-6.webp","r":0.7497}],"lay":{"d":{"mt":-49}}},{"type":"gallery","label":"Design #1","heading":"Final model","body":"Air dry clay, ball bearing, cardstock paper, watercolour paper, Mylar sheet.","layout":"mosaic","images":[{"src":"cup-d1-final-1.webp","r":0.75},{"src":"cup-d1-final-2.webp","r":1.3333},{"src":"cup-d1-final-3.webp","r":0.75},{"src":"cup-d1-final-4.webp","r":1.3339},{"src":"cup-d1-final-5.webp","r":1.3339},{"src":"cup-d1-final-6.webp","r":0.75}],"lay":{"d":{"mt":-29}}},{"type":"gallery","label":"Design #2","heading":"Development and 3D-printed model","body":"","layout":"feature","images":[{"src":"cup-d2-print.webp","r":0.75,"caption":"Final model, 3D print"},{"src":"cup-d2-sketch.webp","r":0.7508,"caption":"Gimbal ring sketch with dimensions","fit":"contain"},{"src":"cup-d2-cad-1.webp","r":1.4667,"caption":"CAD detail"},{"src":"cup-d2-cad-2.webp","r":1.0163,"caption":"CAD, gimbal rings"},{"src":"cup-d2-cad-3.webp","r":1.3817,"caption":"CAD, front view"}],"lay":{"d":{"mt":-57}}},{"type":"gallery","label":"Design #2","heading":"Renders","body":"","layout":"grid","images":[{"src":"cup-hero.webp","r":1},{"src":"cup-render-1.webp","r":1},{"src":"cup-render-2.webp","r":1},{"src":"cup-render-3.webp","r":1}],"lay":{"d":{"mt":-64}}}]},{"id":"spider-cane","num":"02","title":"Spider Cane","accent":"#00A15F","oneLiner":"A low-profile attachment that parks any cane on any table edge in one motion.","summary":"Canes slide or crash to the floor because they have nowhere to be \"parked.\" Spider Cane is a universal, low-profile attachment that clamps an existing cane securely to any surface with one effortless motion.","tags":[],"thumb":{"src":"cane-thumb.webp","r":0.7556},"hero":{"src":"cane-hero.webp","r":2.0408},"meta":[{"k":"Team","v":"Emery Bradshaw Thomas, Yilin Liu, Harrison Sharples"},{"k":"Research","v":"40+ user interviews"},{"k":"Mechanism","v":"0.43 lbf/in compression springs, steel rods, silicone-molded grips"},{"k":"Iterations","v":"7 prototypes"}],"blocks":[{"type":"steps","label":"Scenario","heading":"Barbara's CVS run","body":"","fit":"contain","items":[{"image":{"src":"cane-story-1.webp","r":1.3333},"title":"Barbara walks to CVS","text":""},{"image":{"src":"cane-story-2.webp","r":1.3333},"title":"Arrives at the counter to pay","text":""},{"image":{"src":"cane-story-3.webp","r":1.3333},"title":"Sets her cane against the counter","text":"Wobbly."},{"image":{"src":"cane-story-4.webp","r":1.3333},"title":"The cane falls","text":""},{"image":{"src":"cane-story-5.webp","r":1.3333},"title":"Barbara has to bend down to pick it up","text":""}]},{"type":"steps","label":"Context","heading":"Where do you put the cane?","body":"","fit":"contain","items":[{"image":{"src":"cane-where-1.webp","r":1.3333},"title":"Dinner","text":""},{"image":{"src":"cane-where-2.webp","r":1.3333},"title":"Shopping","text":""},{"image":{"src":"cane-where-3.webp","r":1.3333},"title":"Cooking","text":""}]},{"type":"quotes","label":"User interviews","heading":"We interviewed 40+ people. Here's what they said","items":[{"text":"Buffet, you want soup, both your hands are occupied, you need to put the cane down somewhere.","who":"Terry Seligmann"},{"text":"The wait staff... they're always around the table... they're gonna kick, they're gonna knock over anything standing there.","who":"David"},{"text":"Say 'shit', you gotta bend down to get it... [I] don't want to accentuate the fact that you are using a cane.","who":"Shiela Blumstein"}]},{"type":"journey","label":"User experience","heading":"Anxiety levels on a CVS run","body":"","yLabel":"Anxiety","low":"Low","high":"High","min":0,"max":10,"smooth":false,"phases":[],"series":[{"name":"Anxiety level","color":"","points":[{"label":"Walking into CVS with cane","v":0},{"label":"Arrive at counter to pay","v":0},{"label":"Lean on counter","v":0},{"label":"Set cane down against counter","v":8},{"label":"Pay one hand / two hands free","v":8},{"label":"Pick up cane & leave","v":8}]}],"callout":{"from":4,"to":6,"text":"Remove fear of cane falling down."}},{"type":"text","label":"The problem","heading":"Canes have nowhere to park","body":"Canes frequently slide or crash to the floor because they lack a secure way to be \"parked.\"\n\nThis constant risk of falling canes causes a frustrating loss of autonomy, requiring people to struggle physically with retrieval or rely on others for help."},{"type":"statement","label":"How might we","text":"How might we design a universal, low-profile attachment for existing canes that allows a user to securely attach their canes to any surface with one effortless motion?","groups":[{"title":"Primary goal","items":["Security","Low profile"]},{"title":"Secondary goal","items":["Intuitive & easy","Effortless, one motion"]},{"title":"Emotional goal","items":["Independence","Peace of mind"]}]},{"type":"compare","label":"Existing products","heading":"They rely on balance. Our goal is complete security.","body":"","items":[{"image":{"src":"cane-existing-1.webp","r":1.1076,"fit":"contain"},"title":"Clip-on cane holder","pros":[],"cons":["Moves around on the cane","Slides up and down the cane","Difficult to balance on surface"]},{"image":{"src":"cane-existing-2.webp","r":0.9371,"fit":"contain"},"title":"Flip-up table hook","pros":[],"cons":["Requires flipping up the panel with the other hand before balancing","Difficult to balance on surface"]}],"notes":{"title":"","items":[]}},{"type":"gallery","label":"Ideation","heading":"Sketches, measurements and early mechanisms","body":"","layout":"single","images":[{"src":"cane-ideation.webp","r":2,"caption":"Ideation board","fit":"contain"}]},{"type":"gallery","label":"User testing","heading":"Testing with cane users","body":"","layout":"strip","images":[{"src":"cane-test-1.webp","r":0.75},{"src":"cane-test-2.webp","r":0.75},{"src":"cane-test-3.webp","r":0.75},{"src":"cane-test-4.webp","r":0.75}]},{"type":"iterations","label":"Iterations","heading":"Every prototype is a response to the previous","body":"Drag through the seven prototypes to see how the clamp body changed between rounds.","items":[{"image":{"src":"cane-proto-1.webp","r":0.5769},"label":"Skeleton"},{"image":{"src":"cane-proto-2.webp","r":0.4763},"label":"Too small"},{"image":{"src":"cane-proto-3.webp","r":0.4533},"label":"Too big"},{"image":{"src":"cane-proto-4.webp","r":0.4563},"label":"Too skinny"},{"image":{"src":"cane-proto-5.webp","r":0.7898},"label":"Too alien"},{"image":{"src":"cane-proto-6.webp","r":0.7533},"label":"Needs more curves"},{"image":{"src":"cane-proto-7.webp","r":0.7094},"label":"Just right"}]},{"type":"gallery","label":"Mechanism","heading":"Final mechanism assembly","body":"","layout":"single","images":[{"src":"cane-assembly.webp","r":1.5301,"caption":"Exploded view: 0.43 lbf/in compression springs and steel rods","fit":"contain"}]},{"type":"gallery","label":"Grip","heading":"Silicone molding pattern = increased grip on surfaces","body":"","layout":"mosaic","images":[{"src":"cane-mold-1.webp","r":0.75,"caption":"Mold","fit":"contain"},{"src":"cane-mold-2.webp","r":0.75,"caption":"Molded grip"},{"src":"cane-mold-3.webp","r":0.75,"caption":"Molded grip"},{"src":"cane-mold-4.webp","r":0.75,"caption":"Mold parts","fit":"contain"},{"src":"cane-mold-5.webp","r":0.75,"caption":"Grip variations","fit":"contain"}]},{"type":"steps","label":"Instructions","heading":"Four steps to park a cane","body":"","fit":"cover","items":[{"image":{"src":"cane-step-1.webp","r":0.6288},"title":"Open","text":""},{"image":{"src":"cane-step-2.webp","r":0.625},"title":"Attach","text":""},{"image":{"src":"cane-step-3.webp","r":0.625},"title":"Turn & tighten","text":""},{"image":{"src":"cane-step-4.webp","r":0.62},"title":"Secure to table","text":""}]},{"type":"gallery","label":"Final design","heading":"Spider Cane","body":"","layout":"feature","images":[{"src":"cane-final-3.webp","r":1.4414,"caption":"Render"},{"src":"cane-final-1.webp","r":0.75,"caption":"Parked on a chair back"},{"src":"cane-final-2.webp","r":0.8008,"caption":"Clamped to a table edge"},{"src":"cane-final-4.webp","r":1.4414,"caption":"Full cane, render"}]},{"type":"gallery","label":"","heading":"Views","body":"","layout":"grid","images":[{"src":"cane-view-1.webp","r":1.5,"fit":"contain"},{"src":"cane-view-2.webp","r":1.5,"fit":"contain"},{"src":"cane-view-3.webp","r":1.5,"fit":"contain"},{"src":"cane-view-4.webp","r":1.5,"fit":"contain"}]}]},{"id":"intubation-trainer","num":"03","title":"Intubation Trainer","accent":"#1F9A9C","status":"In progress","oneLiner":"A modular training model for endotracheal intubation that improves  residents preparedness. ","summary":"How can we design a physical training module that offers a more anatomically accurate and effective approach to teaching endotracheal intubation? A Design For America project between RISD and Brown, now in its prototyping phase.","tags":[],"thumb":{"src":"dfa-hero.webp","r":1.5,"blend":"multiply","fit":"cover"},"hero":{"src":"dfa-hero.webp","r":1.5,"caption":"1:1 prototype of the slider mechanism in its casing"},"meta":[{"k":"Status","v":"In progress, Sep 2025 – present"},{"k":"Role","v":"Industrial designer, DFA Health Team"},{"k":"Team","v":"Tanvi Mittal, Vivian Wang, Brightly Shen, Yilin Liu, Peter Cha, Carolyn Wu, Conrad Tseung"},{"k":"Advisors","v":"Dr. Andrew Maslow (Rhode Island Hospital), Prof. Ramisa Fahira (Brown), Josh Saskin (MD-PhD, Yale)"},{"k":"Funding","v":"$1,400+ in prototyping grants from BDW Maker, ID Health and DFA"}],"blocks":[{"type":"text","label":"Endotracheal intubation","heading":"Keeping an airway open","body":"A trained provider inserts a flexible plastic tube through a person's mouth or nose into the trachea. It keeps the airway open so air and oxygen reach the lungs, and it allows mechanical ventilation."},{"type":"stats","label":"","heading":"","note":"Annual figures for U.S. healthcare providers, from the team's research.","items":[{"value":"~15M","text":"intubations performed in operating rooms each year"},{"value":"~650K","text":"intubations performed outside the OR"},{"value":"~346K","text":"of those in emergency departments"},{"value":"~40%","text":"of emergency intubations result in major adverse events"}]},{"type":"gallery","label":"Research","heading":"Hands-on with today's trainers","body":"","layout":"grid","images":[{"src":"dfa-research-1.webp","r":0.5639},{"src":"dfa-research-2.webp","r":0.562},{"src":"dfa-research-3.webp","r":0.562},{"src":"dfa-current.webp","r":1.1039,"caption":"Current airway management trainer"}]},{"type":"list","label":"The problem","heading":"Trainers are expensive and anatomically generic","body":"","items":[{"title":"Expensive","text":"$1K+ for a standard model, around $5K for advanced models."},{"title":"Static, generalised anatomy","text":"Every trainee practises on the same ideal airway."},{"title":"No feedback","text":"Current models lack feedback mechanisms."},{"title":"Poor materiality","text":"The materials do not behave like human tissue."},{"title":"Abnormal physiology is missing","text":"Trauma, swelling, masses, congenital defects, obesity and overbite are poorly represented."}]},{"type":"list","label":"Deep dive","heading":"What the research pointed to","body":"","items":[{"title":"Disease state fundamentals","text":"Complications spike outside the OR, where time pressure and patient instability are highest."},{"title":"Existing solutions","text":"Affordable mannequins lack realism, while high-fidelity simulators are too expensive for repeated use."},{"title":"Analogous solutions","text":"Bronchoscopy and endoscopy simulators prove haptics, metrics and scenario variability can coexist. Aviation training shows variable scenarios build more adaptive, real-world skills."}],"image":{"src":"dfa-clinic.webp","r":1.3575,"caption":"Clinical consultation"}},{"type":"statement","label":"Design solution","text":"A linear rail lets the internal tracheal target shift sideways, simulating an airway displaced by trauma, swelling, hematoma or distorted anatomy.","groups":[{"title":"Atypical airway","items":["Tracheal displacement","Spatial unpredictability","Real-world difficult airways"]}]},{"type":"gallery","label":"Ideation & sketching","heading":"Sketching & Ideation","layout":"mosaic","body":"Two problems were drawn out side by side: a slider that lets the trachea shift sideways on a rail, and a mold that can cast it in silicone.","images":[{"src":"dfa-sketch-1.webp","r":0.7727,"caption":"Exploratory concept: a rail-mounted tracheal model enabling lateral displacement","fit":"contain"},{"src":"dfa-sketch-2.webp","r":0.7727,"fit":"contain"},{"src":"dfa-wf-1.webp","r":1.8281,"caption":"Sketching"},{"src":"dfa-next.webp","r":0.9551,"caption":"Multi-part tracheal mold with keys and a vent, printed in ABS with the layer lines removed for a smooth surface","fit":"contain"},{"src":"dfa-sketch-3.webp","r":0.773,"fit":"contain","lay":{"d":{"x":105.09,"y":-354}}},{"src":"dfa-sketch-4.webp","r":1.4317,"caption":"Back to the drawing board: fastener-free rails that allow quick displacement","fit":"contain"},{"src":"dfa-pla-2.webp","r":0.7067,"caption":"Slider clamp modelled in CAD","fit":"contain","lay":{"d":{"x":-105.09,"y":1379,"w":100,"ar":1.2031}}},{"src":"dfa-pla-3.webp","r":0.7067,"caption":"Toothed rail modelled in CAD","fit":"contain","lay":{"d":{"y":728,"x":-0.78}}}]},{"type":"gallery","label":"Fabrication","heading":"Fabrication","layout":"mosaic","body":"3d Printing & Silicone casting with the team.","images":[{"src":"dfa-proto-1.webp","r":1.07},{"src":"dfa-wf-3.webp","r":0.75,"caption":"Mixing silicone"},{"src":"dfa-proto-3.webp","r":0.9854},{"src":"dfa-cast.webp","r":1.7778,"caption":"Casting"},{"src":"dfa-proto-2.webp","r":1.4182}],"lay":{"d":{"y":-260}}},{"type":"gallery","label":"Prototypes","heading":"Prototypes","layout":"mosaic","body":"From low-fidelity wood studies to 3D-printed mechanisms and 1:1 silicone tracheas.","images":[{"src":"dfa-wood-1.webp","r":1.5018,"caption":"Low-fidelity wood studies testing the mechanics and range of motion of the rail-mounted trachea"},{"src":"dfa-wood-2.webp","r":1.5},{"src":"dfa-wood-3.webp","r":1.5},{"src":"dfa-pla-1.webp","r":1.4995,"caption":"Iterative PLA prints testing motion and assembly"},{"src":"dfa-case-2.webp","r":1.5,"caption":"The latest mechanism, 3D printed within an integrated casing to evaluate fit and function"},{"src":"dfa-case-3.webp","r":1.5},{"src":"dfa-sil-2.webp","r":1.5,"caption":"Mold designs in progress, refining material behaviour and repeatability"},{"src":"dfa-sil-3.webp","r":1.5},{"src":"dfa-sil-4.webp","r":1.5},{"src":"dfa-sil-1.webp","r":1.5,"caption":"1:1 silicone trachea casts"}],"lay":{"d":{"mt":-240}}},{"type":"list","label":"Next steps","heading":"Toward a proof of concept","body":"","items":[{"title":"Iterative prototyping & material testing","text":"Refining rail systems, mold designs and material behaviour through 3D prints and silicone casting."},{"title":"Integrated system validation","text":"Assembling full-scale components within a casing to evaluate fit, function and simulation performance."},{"title":"User testing & performance feedback","text":"Engaging clinicians to test usability, realism and training value."},{"title":"Translational roadmap","text":"Move the project into DesignXHealth, build an engineering team and file a provisional patent."}],"lay":{"d":{"mt":-85}}},{"type":"gallery","label":"Team","heading":"DFA Health","body":"","layout":"single","images":[{"src":"dfa-team.webp","r":1.5974,"caption":"The DFA Health team"}],"lay":{"d":{"mt":-58}}}]},{"id":"relaxation-bracelet","num":"04","title":"Relaxation Bracelet","accent":"#0A64D6","oneLiner":"A portable and accessible bracelet that aims to reduce teenage stress through vibrations and pattern touching.","summary":"A portable and accessible bracelet that aims to reduce teenage stress through vibrations and pattern touching.","tags":[],"thumb":{"src":"br-thumb.webp","r":1.0584},"hero":{"src":"br-hero.webp","r":1.5004},"meta":[{"k":"Focus","v":"Stress in teenagers"},{"k":"Interaction","v":"Vibration and tactile patterns, started from a phone app"},{"k":"Research","v":"Interviews with high school students, persona"}],"blocks":[{"type":"text","label":"1.0 Background research","heading":"The issue: teenage stress","body":"Stress amongst teens has become a prominent issue in today's society, negatively impacting many aspects of young people's lives. According to the WHO (World Health Organization), one in seven 10–19-year-olds experiences stress."},{"type":"stats","label":"","heading":"","note":"","items":[{"value":"1 in 7","text":"adolescents experience stress"},{"value":"5.8 / 10","text":"average stress level American teens rated themselves"},{"value":"3.8 / 10","text":"average adult stress level"},{"value":"80%","text":"of students claim to feel stressed out every day at school"},{"value":"39%","text":"of students have suicidal thoughts because of stress"}]},{"type":"people","label":"2.1 Interviews","heading":"Two high school students","body":"","items":[{"name":"Talia","sub":"17 · High school student","meta":[],"body":"","sections":[{"title":"What makes you stressed?","items":["School & academic pressure","Strict parents","Future career & university"]},{"title":"How has this impacted your wellbeing?","items":["Difficulties falling asleep at night","Depressive symptoms"]},{"title":"What do you do when you feel stressed?","items":["Listen to music","Hang out with friends","Watch movies","Journaling"]}],"image":{"src":""}},{"name":"Wayne","sub":"17 · High school student","meta":[],"body":"","sections":[{"title":"What makes you stressed?","items":["School & academic pressure","Injuries and bad athletic performance","Relationships"]},{"title":"How has this impacted your wellbeing?","items":["Insomnia and other sleep issues","Sick very often","Unmotivated, lethargic"]},{"title":"What do you do when you feel stressed?","items":["Listen to music and play guitar","Go to the gym","Social media"]}],"image":{"src":""}}]},{"type":"list","label":"2.2 Analysis","heading":"What the interviews showed","body":"","items":[{"title":"Teens are not seeking help or therapy","text":"Therapy is expensive and stigmatized. Adolescents would rather bottle up stress than talk to a professional counsellor."},{"title":"Stimulate senses as a way to reduce stress","text":"Teens cope with stress in various ways, but these activities all activate a sensory experience to relieve stress."}]},{"type":"people","label":"2.3 User persona","heading":"","body":"","items":[{"name":"Alexander","sub":"17 · High school student","meta":[],"body":"","sections":[{"title":"Challenges","items":["Maintain high grades","Balance extracurriculars","Maintain healthy friendships & relationships","Difficulty seeking help"]},{"title":"User needs","items":["Accessible and easy to use","Portable","Fashionable & unique","Suited for multiple activities"]}],"image":{"src":"br-alexander.webp","r":0.39,"fit":"contain"}}]},{"type":"statement","label":"3.0 Concept development","text":"How might we create a wearable product that aims to reduce stress through haptic sensory experiences such as vibrations and pattern touching?","groups":[{"title":"Design focus","items":["Wearable","Sensory","Trendy"]},{"title":"Sensory channels","items":["Patterns","Vibration"]}]},{"type":"list","label":"3.1 Design focus","heading":"How touch and vibration calm the body","body":"","items":[{"title":"Patterns","text":"Information received by neurons in the tactile receptors of the hand is transported to the somatosensory cortex, which processes the tactile quality. Then it reaches the limbic system, responsible for processing the emotional aspect of the tactile experience."},{"title":"Vibration","text":"Vibrations can enhance blood circulation, stimulate the parasympathetic nervous system, relax tense muscles, and stimulate C tactile afferents that are responsible for positive emotions."},{"title":"Parasympathetic nervous system","text":"The parasympathetic nervous system is responsible for promoting relaxation, conserving energy, and facilitating restorative functions in the body."}]},{"type":"gallery","label":"4.1 Sketches","heading":"Pattern studies on the wrist","body":"","layout":"single","images":[{"src":"br-sketch-row.webp","r":4.336,"caption":"Eight pattern studies","fit":"contain"},{"src":"br-sketch.webp","r":1.0481,"caption":"Final form: on/off button, battery indicator, vibration sensor","fit":"contain"}]},{"type":"steps","label":"4.2 User scenario","heading":"Three steps to calm","body":"","fit":"contain","items":[{"image":{"src":"br-scn-1.webp","r":1.7442},"title":"Connect device with phone","text":""},{"image":{"src":"br-scn-2.webp","r":0.752},"title":"Open app and begin session","text":""},{"image":{"src":"br-scn-3.webp","r":0.7692},"title":"Relax and enjoy","text":""}]},{"type":"gallery","label":"4.3 Prototypes, models & scenarios","heading":"","body":"","layout":"mosaic","images":[{"src":"br-proto-1.webp","r":0.7497},{"src":"br-proto-2.webp","r":0.7497},{"src":"br-proto-3.webp","r":0.7497},{"src":"br-proto-4.webp","r":0.7497},{"src":"br-scenarios.webp","r":1.3333,"caption":"Scenarios: everyday wear","fit":"contain"}]},{"type":"gallery","label":"5.0 Renders","heading":"","body":"","layout":"feature","images":[{"src":"br-render-1.webp","r":1.5},{"src":"br-render-2.webp","r":1.5},{"src":"br-render-3.webp","r":1.5}]},{"type":"gallery","label":"Photos","heading":"Worn and printed","body":"","layout":"mosaic","images":[{"src":"br-photo-1.webp","r":0.6667},{"src":"br-photo-2.webp","r":1.5},{"src":"br-photo-3.webp","r":0.6667},{"src":"br-photo-4.webp","r":0.6667},{"src":"br-photo-5.webp","r":1.5},{"src":"br-photo-6.webp","r":0.6667},{"src":"br-photo-7.webp","r":0.6667},{"src":"br-photo-8.webp","r":0.6667},{"src":"br-photo-9.webp","r":0.6667}]}]},{"id":"sleepy-shroom","num":"05","title":"Sleepy Shroom","accent":"#F23561","oneLiner":"Lamp for adolescents aiming to improve sleep and reduce insomnia through reducing screen time and increasing melatonin production.","summary":"Lamp design for adolescents that aims to improve sleep and reduce insomnia through reducing screen time and increasing natural melatonin production.","tags":[],"thumb":{"src":"sh-thumb.webp","r":0.8257},"hero":{"src":"sh-hero.webp","r":1},"meta":[{"k":"Focus","v":"Insomnia and screen time in teenagers"},{"k":"Research","v":"Interviews and a survey of 41 adolescents aged 16–19"},{"k":"Features","v":"Warm light, low-frequency sound, phone slot with Bluetooth charging"}],"blocks":[{"type":"text","label":"1.0 Background research","heading":"The issue: insomnia & sleep issues","body":"We all love sleep, but sometimes it can be very difficult to fall asleep. Insomnia is a common issue amongst all age groups, but research shows that insomnia and other sleeping problems are becoming more prevalent amongst teens and adolescents."},{"type":"stats","label":"","heading":"","note":"","items":[{"value":"1 in 4","text":"adolescents aged 16–24 globally suffer from insomnia every night"},{"value":"8 min","text":"of screen time will stimulate your brain for 1 hour"},{"value":"6.5–7.5 h","text":"average teenager daily sleep time"},{"value":"8–9 h","text":"recommended sleep time for teenagers and adolescents"}]},{"type":"list","label":"1.2 Effects","heading":"Effects of insomnia and bad sleep","body":"","items":[{"title":"Worse physical & mental health","text":""},{"title":"Poor academic performance","text":""},{"title":"Social & behavioural issues","text":""}]},{"type":"people","label":"2.1 User interviews","heading":"Two teenagers who sleep badly","body":"","items":[{"name":"Alice","sub":"18","meta":[{"k":"Goes to bed","v":"1–2 a.m."},{"k":"Total sleep","v":"6–8 hours"}],"body":"","sections":[{"title":"What causes your insomnia?","items":["Bad schedule & routine","Studying and school work"]},{"title":"What do you do before sleep?","items":["Scroll through phone","Revenge bedtime procrastination","Homework"]},{"title":"What do you do to relax?","items":["Play and listen to music","Social media"]},{"title":"Are you worried about your sleep?","items":["Concerned about impact on grades","Concerned about health impacts"]}],"image":{"src":""}},{"name":"Yilin","sub":"17","meta":[{"k":"Goes to bed","v":"12–1 a.m."},{"k":"Total sleep","v":"5–7 hours"}],"body":"","sections":[{"title":"What causes your insomnia?","items":["Phone before bed","Studying and school work"]},{"title":"What do you do before sleep?","items":["Social media","Play music","Homework & assignments"]},{"title":"What do you do to relax?","items":["Music","Drawing"]},{"title":"Are you worried about your sleep?","items":["Hate feeling lazy and lethargic","Worried about effects on brain","Low energy levels during the day","Looking to improve sleep"]}],"image":{"src":""}}]},{"type":"survey","label":"Survey","heading":"What 41 adolescents said","body":"Conducted a survey for adolescents aged 16–19 regarding sleep. 41 responses were recorded.","questions":[{"q":"Do you use your phone or other stimulating activities before bed?","options":[{"label":"Yes","pct":95.1},{"label":"No","pct":4.9}]},{"q":"Do you find it difficult to fall asleep?","options":[{"label":"Yes","pct":51.2},{"label":"Sometimes","pct":31.7},{"label":"No","pct":17.7}]}]},{"type":"journey","label":"2.2 User journey map","heading":"Falling asleep, bad night vs. good night","body":"The journey map explores the process of falling asleep from the perspective of a teenager who suffers from insomnia.","yLabel":"Emotion","low":"Negative","high":"Positive","min":-4,"max":4,"smooth":true,"phases":[{"label":"Before sleep","from":1,"to":3},{"label":"Sleeping","from":4,"to":6},{"label":"After sleep","from":7,"to":9}],"series":[{"name":"Bad sleep","color":"","points":[{"label":"Routine before bed","v":-0.3},{"label":"Getting in bed","v":1},{"label":"Social media or phone","v":2.6},{"label":"Incapable of falling asleep","v":-1},{"label":"Struggling to sleep","v":-3.4},{"label":"Eventually sleeping","v":-0.5},{"label":"Difficulty waking up","v":-0.3},{"label":"Feeling lazy","v":-1.3},{"label":"Affects entire day","v":-2.2}]},{"name":"Good sleep","color":"#4F6BFF","points":[{"label":"Routine before bed","v":-0.3},{"label":"Getting in bed","v":1},{"label":"No phone, no social media","v":-1.5},{"label":"Falling asleep easily","v":0.5},{"label":"Sleeping","v":1.6},{"label":"Deep sleep, body healing","v":2.4},{"label":"Wakes up easily","v":1.5},{"label":"Feeling energized","v":2.4},{"label":"Positive day","v":3.2}]}],"callout":{"from":1,"to":3,"text":"Design opportunity: focus on improving the experience before sleep."}},{"type":"list","label":"2.3 Summary","heading":"Summary of interviews & survey","body":"","items":[{"title":"","text":"Adolescents indulge in stimulating activities before bed (social media, TV, video games)."},{"title":"","text":"Visual & auditory experiences can promote sleep."},{"title":"","text":"Adolescents need a product to improve sleep that is easy to use."}]},{"type":"people","label":"2.4 User persona","heading":"","body":"","items":[{"name":"Emma","sub":"18","meta":[],"body":"","sections":[{"title":"User goals and needs","items":["Easy to use","Improve sleep quality","Limit her screen time before bed"]},{"title":"Challenges","items":["Difficulty falling asleep","Excessive screen time before bed, \"revenge bedtime procrastination\""]}],"image":{"src":""}}]},{"type":"statement","label":"3.0 Concept development","text":"How might we design a product for adolescents that improves sleep through reducing screen time and increasing natural melatonin production with visual & audio experiences?","groups":[{"title":"Goals","items":["Improve sleep","Increase natural melatonin production","Reduce screen time"]},{"title":"Features","items":["Visual experience (light)","Auditory experience","Phone slot"]}]},{"type":"list","label":"Light & sound","heading":"What the research says about light and sound","body":"","items":[{"title":"Warmer light = better sleep","text":"Light colour temperature runs from warm (2000 K) to cool (10,000 K)."},{"title":"Lower light intensity = more melatonin","text":"Dim light supports natural melatonin production; bright light suppresses it."},{"title":"Sound below 1000 Hz","text":"Low-frequency sounds below 1000 Hz can induce a state of relaxation and contribute to melatonin production. (Human hearing spans 20 Hz to 20,000 Hz.)"}]},{"type":"gallery","label":"4.3 Sketches","heading":"Sleepy Shroom works only when you insert your phone","body":"","layout":"single","images":[{"src":"sh-sketch.webp","r":1.8626,"caption":"Front, side and top sketches, 25 cm","fit":"contain"}]},{"type":"steps","label":"4.4 User scenario","heading":"Phone in, lights down","body":"","fit":"cover","items":[{"image":{"src":"sh-scn-1.webp","r":0.863},"title":"Put your phone in the phone slot","text":"Bluetooth charging."},{"image":{"src":"sh-scn-2.webp","r":0.863},"title":"Sleepy Shroom makes sure you sleep tight","text":"Warm light and calming sound."}]},{"type":"gallery","label":"4.5 Prototypes","heading":"","body":"","layout":"grid","images":[{"src":"sh-proto-1.webp","r":0.7497},{"src":"sh-proto-2.webp","r":0.7497}]},{"type":"gallery","label":"5.0 Renders & photos","heading":"","body":"","layout":"mosaic","images":[{"src":"sh-render-1.webp","r":1},{"src":"sh-render-2.webp","r":1},{"src":"sh-render-3.webp","r":0.6667},{"src":"sh-render-4.webp","r":0.6667},{"src":"sh-render-5.webp","r":0.6667},{"src":"sh-render-6.webp","r":0.6669},{"src":"sh-render-7.webp","r":1.5},{"src":"sh-render-8.webp","r":1.5},{"src":"sh-render-9.webp","r":0.6667},{"src":"sh-render-10.webp","r":0.6669}]}]},{"id":"braille-watch","num":"06","title":"Braille Watch","accent":"ink","oneLiner":"A watch that raises the time in braille, so it can be read by touch.","summary":"A dynamic braille watch with tactile, real-time timekeeping that empowers visually impaired users.","tags":[],"thumb":{"src":"bw-thumb.webp","r":1.517},"hero":{"src":"bw-hero.webp","r":1.7778},"meta":[{"k":"Status","v":"Ongoing project"},{"k":"Focus","v":"Telling the time without sight or sound"},{"k":"Electronics","v":"Arduino Uno driving 14 × 12 V mini solenoids"}],"blocks":[{"type":"text","label":"Background research","heading":"Reading the time by touch","body":"Millions of visually impaired individuals face challenges in accessing everyday tools designed primarily for sighted users, including something as essential as checking the time. Traditional watches rely on visual displays, while many accessible alternatives, such as talking watches, can be inconvenient in noisy or quiet environments.\n\nThis project aims to bridge that gap by creating a braille-based watch with a dynamic, tactile interface that allows users to feel the time instantly, enhancing accessibility, independence, and efficiency in daily life.","image":{"src":"bw-eyes.webp","r":0.6671},"side":"right"},{"type":"stats","label":"","heading":"","note":"","items":[{"value":"2.2 billion","text":"people worldwide have some form of visual impairment"},{"value":"1 in 4","text":"people worldwide live with some form of visual impairment"}]},{"type":"braille","label":"Braille notation","heading":"The time, in braille digits","body":"Braille is a tactile writing system used by visually impaired individuals to read and write through touch. Developed by Louis Braille in the early 19th century, it consists of raised dots arranged in cells of six positions (two columns of three dots). Different combinations of these dots represent letters, numbers, punctuation, and even mathematical and musical notation.\n\nFor this project, we focus on braille notation from 0–9. The clock here shows the current time the way the watch raises it."},{"type":"people","label":"User persona","heading":"","body":"","items":[{"name":"Alex Chen","sub":"27 · Toronto, Canada","meta":[{"k":"Disability","v":"Fully blind since childhood due to retinopathy of prematurity"}],"body":"Alex leads an independent lifestyle, commuting daily using public transportation and relying on assistive technologies like screen readers and braille displays. While they use a smartphone for accessibility, checking the time can be inconvenient, especially in noisy environments where voice assistance is impractical or when they prefer discretion.","sections":[{"title":"Pain points","items":["Traditional watches rely on sight, making them inaccessible.","Audio-based timekeeping (talking watches, phone assistants) can be disruptive or impractical in certain situations."]},{"title":"Needs","items":["A discreet and efficient way to check the time.","A real-time tactile interface for quick access.","Independence and accessibility in daily tasks.","Something that looks sleek and like a normal watch."]}],"image":{"src":""}}]},{"type":"compare","label":"Market research","heading":"Existing tactile watches","body":"","items":[{"image":{"src":"bw-market-1.webp","r":1,"fit":"cover"},"title":"","pros":[],"cons":[]},{"image":{"src":"bw-market-2.webp","r":1,"fit":"cover"},"title":"","pros":[],"cons":[]},{"image":{"src":"bw-market-3.webp","r":0.8031,"fit":"cover"},"title":"","pros":[],"cons":[]}],"notes":{"title":"Issues","items":["Analog displays make it difficult to tell the time","Hard to follow the hands on the clock","Impossible to adjust the time"]}},{"type":"statement","label":"Design focus","text":"","groups":[{"title":"Design focus","items":["Digital display","Direct touch interaction","Modern design"]}]},{"type":"gallery","label":"Ideation","heading":"Sketches and braille spacing","body":"","layout":"grid","images":[{"src":"bw-sketch-1.webp","r":1.0537,"caption":"Sleek, classic form, 4 cm face","fit":"contain"},{"src":"bw-sketch-2.webp","r":1.3258,"caption":"Braille dot spacing: 2.29 mm, 6 mm, 1.4 mm, 0.8 mm","fit":"contain"}]},{"type":"gallery","label":"3D modeling","heading":"","body":"","layout":"mosaic","images":[{"src":"bw-cad-4.webp","r":1.3762,"caption":"Top view"},{"src":"bw-cad-3.webp","r":1.3752,"caption":"Perspective"},{"src":"bw-cad-1.webp","r":1.601},{"src":"bw-cad-2.webp","r":1.601,"caption":"Pin array"},{"src":"bw-cad-5.webp","r":1.3762,"caption":"Case section"}]},{"type":"gallery","label":"Prototype","heading":"","body":"","layout":"grid","images":[{"src":"bw-proto-1.webp","r":0.75},{"src":"bw-proto-2.webp","r":0.75},{"src":"bw-proto-3.webp","r":0.75}]},{"type":"list","label":"Circuit design","heading":"Materials","body":"","items":[{"title":"Arduino Uno","text":""},{"title":"12 V mini solenoids × 14","text":""},{"title":"N-channel MOSFET (TIP120)","text":""},{"title":"Flyback diodes (1N4007)","text":""},{"title":"220 Ω resistors","text":""},{"title":"12 V DC power supply","text":""},{"title":"Breadboard","text":""},{"title":"Jumper wires","text":""},{"title":"Barrel jack adapter","text":""},{"title":"Wire cable connector","text":""}],"image":{"src":"bw-circuit.webp","r":1.6319,"caption":"Circuit diagram","fit":"contain"}},{"type":"gallery","label":"Building the circuit","heading":"","body":"","layout":"mosaic","images":[{"src":"bw-build-1.webp","r":0.75},{"src":"bw-build-2.webp","r":0.75},{"src":"bw-build-3.webp","r":0.75},{"src":"bw-build-4.webp","r":0.75},{"src":"bw-build-5.webp","r":0.75},{"src":"bw-build-7.webp","r":0.75}]},{"type":"gallery","label":"Code","heading":"Arduino sketch","body":"","layout":"grid","images":[{"src":"bw-code-1.webp","r":1.7917,"caption":"Pin definitions and braille patterns","fit":"contain"},{"src":"bw-code-2.webp","r":1.788,"caption":"Display update functions","fit":"contain"}]},{"type":"gallery","label":"Renders","heading":"","body":"","layout":"feature","images":[{"src":"bw-render-1.webp","r":1.7787},{"src":"bw-render-2.webp","r":1.7787},{"src":"bw-render-3.webp","r":1.7787},{"src":"bw-render-4.webp","r":1.7787},{"src":"bw-render-5.webp","r":1.7787},{"src":"bw-render-6.webp","r":1.7787}]}]},{"id":"stellantis-liveries","num":"07","title":"Stellantis","accent":"#3F5E8D","oneLiner":"Summer Internship at Stellantis Shanghai","summary":"
